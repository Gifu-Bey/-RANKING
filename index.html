<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ベイブレード戦績ランキング</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d29;
            --accent-color: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text-color: #ffffff;
            --text-sub: #a0aec0;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.5rem;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin: 5px 0 0;
        }

        /* タブメニュー */
        .tab-menu {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 2px 4px rgba(0,210,255,0.4);
        }

        /* ランキングカード */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border-left: 4px solid transparent;
            transition: transform 0.2s;
        }

        .ranking-card:hover {
            transform: translateY(-2px);
        }

        .rank-1 { border-left-color: var(--gold); }
        .rank-2 { border-left-color: var(--silver); }
        .rank-3 { border-left-color: var(--bronze); }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-number {
            font-size: 1.2rem;
            font-weight: bold;
            width: 30px;
            text-align: center;
            color: var(--text-sub);
        }

        .rank-1 .rank-number { color: var(--gold); }
        .rank-2 .rank-number { color: var(--silver); }
        .rank-3 .rank-number { color: var(--bronze); }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .player-stats {
            text-align: right;
        }

        .points {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .sub-stats {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* コンテンツ切り替え */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            text-align: center;
            color: var(--text-sub);
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Beyblade Ranking</h1>
            <p>ソラムツホビー会 / 戦績・ポイントランキング</p>
        </header>

        <!-- タブ切り替えボタン -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('overall')">総合</button>
            <button class="tab-btn" onclick="switchTab('match3on3')">3on3</button>
            <button class="tab-btn" onclick="switchTab('single')">シングル</button>
        </div>

        <!-- 総合ランキング -->
        <div id="overall" class="tab-content active">
            <div class="ranking-list" id="list-overall">
                <div class="loading">データを読み込み中...（またはサンプル表示）</div>
            </div>
        </div>

        <!-- 3on3ランキング -->
        <div id="match3on3" class="tab-content">
            <div class="ranking-list" id="list-match3on3">
                <div class="loading">読み込み中...</div>
            </div>
        </div>

        <!-- シングルランキング -->
        <div id="single" class="tab-content">
            <div class="ranking-list" id="list-single">
                <div class="loading">読み込み中...</div>
            </div>
        </div>
    </div>

    <script>
        // タブ切り替えのロジック
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // --- 【今後スプレッドシートと連携する部分のイメージ】 ---
        // テスト用に仮のデータを表示させています
        const sampleData = {
            overall: [
                { rank: 1, name: "プレイヤーA", points: 1200, wins: 3, battles: 5 },
                { rank: 2, name: "プレイヤーB", points: 950, wins: 1, battles: 4 },
                { rank: 3, name: "プレイヤーC", points: 800, wins: 1, battles: 3 }
            ],
            match3on3: [
                { rank: 1, name: "プレイヤーC", points: 500, wins: 2, battles: 2 },
                { rank: 2, name: "プレイヤーA", points: 400, wins: 1, battles: 3 }
            ],
            single: [
                { rank: 1, name: "プレイヤーA", points: 700, wins: 2, battles: 2 },
                { rank: 2, name: "プレイヤーB", points: 550, wins: 1, battles: 3 }
            ]
        };

        function renderRankings() {
            for (const [key, data] of Object.entries(sampleData)) {
                const container = document.getElementById(`list-${key}`);
                if (!container) continue;

                container.innerHTML = "";
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `ranking-card rank-${item.rank}`;
                    card.innerHTML = `
                        <div class="player-info">
                            <div class="rank-number">${item.rank}</div>
                            <div class="player-name">${item.name}</div>
                        </div>
                        <div class="player-stats">
                            <div class="points">${item.points} pt</div>
                            <div class="sub-stats">優勝:${item.wins}回 / 参加:${item.battles}回</div>
                        </div>
                    `;
                    container.append(card);
                });
            }
        }

        // 画面を開いたときに描画を実行
        window.onload = renderRankings;
    </script>
</body>
</html>
