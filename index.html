<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ちょこベイ ランキング</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d29;
            --accent-color: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text-color: #ffffff;
            --text-sub: #a0aec0;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.5rem;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin: 5px 0 0;
        }

        /* タブメニュー */
        .tab-menu {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 2px 4px rgba(0,210,255,0.4);
        }

        /* ランキングカード */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border-left: 4px solid transparent;
            transition: transform 0.2s;
        }

        .rank-1 { border-left-color: var(--gold); }
        .rank-2 { border-left-color: var(--silver); }
        .rank-3 { border-left-color: var(--bronze); }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-number {
            font-size: 1.2rem;
            font-weight: bold;
            width: 30px;
            text-align: center;
            color: var(--text-sub);
        }

        .rank-1 .rank-number { color: var(--gold); }
        .rank-2 .rank-number { color: var(--silver); }
        .rank-3 .rank-number { color: var(--bronze); }

        /* プレイヤーアイコン（丸型） */
        .player-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #2d3748;
            border: 2px solid var(--accent-color);
            flex-shrink: 0;
        }

        /* アイコンがない場合のダミー用 */
        .player-icon-default {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .player-stats {
            text-align: right;
        }

        .points {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .sub-stats {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading, .error-msg {
            text-align: center;
            color: var(--text-sub);
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ちょこベイ ランキング</h1>
            <p>ベイブレードX 戦績・ポイントランキング</p>
        </header>

        <!-- タブ切り替えボタン -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('overall', event)">総合</button>
            <button class="tab-btn" onclick="switchTab('match3on3', event)">3on3</button>
            <button class="tab-btn" onclick="switchTab('single', event)">1on1</button>
        </div>

        <!-- 総合ランキング -->
        <div id="overall" class="tab-content active">
            <div class="ranking-list" id="list-overall">
                <div class="loading">スプレッドシートからデータを読み込み中...</div>
            </div>
        </div>

        <!-- 3on3ランキング -->
        <div id="match3on3" class="tab-content">
            <div class="ranking-list" id="list-match3on3">
                <div class="loading">読み込み中...</div>
            </div>
        </div>

        <!-- 1on1ランキング -->
        <div id="single" class="tab-content">
            <div class="ranking-list" id="list-single">
                <div class="loading">読み込み中...</div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1-N3nf2jO0LJ5LksA7OgIm1DmA8cAhCAa21CtAs5_MGg';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        let globalPlayersData = [];

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Googleドライブの共有URLを直リンク（表示用URL）に変換するヘルパー関数
        function convertDriveUrl(url) {
            if (!url) return '';
            // /file/d/xxxx/view 形式の場合
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            // ?id=xxxx 形式の場合
            const matchQuery = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (matchQuery && matchQuery[1]) {
                return `https://lh3.googleusercontent.com/d/${matchQuery[1]}`;
            }
            return url; // その他のURLならそのまま返す
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let row = [];
                let entry = '';
                let inQuotes = false;
                for (let char of lines[i]) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                result.push(row);
            }
            return result;
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(CSV_URL);
                const dataText = await response.text();
                const rows = parseCSV(dataText);

                globalPlayersData = [];

                rows.forEach(row => {
                    const name = row[1]; // B列: ブレーダー名
                    if (name && name !== '') {
                        const score1on1 = parseInt(row[10]) || 0; // K列
                        const score3on3 = parseInt(row[11]) || 0; // L列
                        const totalScore = parseInt(row[12]) || (score1on1 + score3on3); // M列
                        const rawIconUrl = row[25] || ''; // Z列（インデックス25）: アイコン画像URL
                        const iconUrl = convertDriveUrl(rawIconUrl);

                        globalPlayersData.push({
                            name: name,
                            score1on1: score1on1,
                            score3on3: score3on3,
                            totalScore: totalScore,
                            iconUrl: iconUrl
                        });
                    }
                });

                renderAllRankings();

            } catch (error) {
                console.error('データ取得エラー:', error);
                document.querySelectorAll('.ranking-list').forEach(el => {
                    el.innerHTML = `<div class="error-msg">データの読み込みに失敗しました。<br>スプレッドシートの公開設定をご確認ください。</div>`;
                });
            }
        }

        function renderRankingList(containerId, dataList, scoreKey) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const sorted = [...dataList].sort((a, b) => b[scoreKey] - a[scoreKey]);

            container.innerHTML = '';

            if (sorted.length === 0 || sorted.every(p => p[scoreKey] === 0)) {
                container.innerHTML = `<div class="loading">有効なデータがまだありません</div>`;
                return;
            }

            let currentRank = 1;
            sorted.forEach((player, index) => {
                if (player[scoreKey] === 0) return;

                if (index > 0 && sorted[index - 1][scoreKey] > player[scoreKey]) {
                    currentRank = index + 1;
                }

                // アイコンのHTML生成（画像があれば丸型表示、なければ名前の頭文字の丸）
                let iconHtml = '';
                if (player.iconUrl) {
                    iconHtml = `<img src="${player.iconUrl}" class="player-icon" alt="${player.name}">`;
                } else {
                    const initial = player.name.charAt(0);
                    iconHtml = `<div class="player-icon-default">${initial}</div>`;
                }

                const card = document.createElement('div');
                card.className = `ranking-card rank-${currentRank <= 3 ? currentRank : 'other'}`;
                card.innerHTML = `
                    <div class="player-info">
                        <div class="rank-number">${currentRank}</div>
                        ${iconHtml}
                        <div class="player-name">${player.name}</div>
                    </div>
                    <div class="player-stats">
                        <div class="points">${player[scoreKey].toLocaleString()} pt</div>
                        <div class="sub-stats">総合:${player.totalScore.toLocaleString()}pt / 3on3:${player.score3on3} / 1on1:${player.score1on1}</div>
                    </div>
                `;
                container.append(card);
            });
        }

        function renderAllRankings() {
            renderRankingList('list-overall', globalPlayersData, 'totalScore');
            renderRankingList('list-match3on3', globalPlayersData, 'score3on3');
            renderRankingList('list-single', globalPlayersData, 'score1on1');
        }

        window.onload = fetchSheetData;
    </script>
</body>
</html>
